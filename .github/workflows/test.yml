name: Test

# Builds the SDK (codegen falls back to the committed schema.gql when the
# sibling API schemas aren't checked out) and runs the offline unit suite with
# coverage. The live e2e suites (test/e2e/**) auto-skip without a configured
# stack (CROWDY_* env), so they aren't run here; point them at a deployed env or
# the local smoke stack to execute them.
#
# Runs on EVERY branch push, not just the canonical ones. A branch with no PR open
# used to run nothing here while still being one merge away from a release tag, so
# the first time its tests ran was the release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build + unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `src/generated/graphql.ts` is committed output, and `build` does not run
      # codegen -- so a hand-edit, or a `schema.gql` synced without a regenerate,
      # was previously invisible here and shipped. This is the in-repo half of the
      # question and it is hermetic: codegen reads the COMMITTED schema.gql, so it
      # needs no network and no sibling checkout. The other half -- whether
      # schema.gql still matches the SDL a tier publishes -- is `schema:sync`,
      # which does need the network and therefore stays an operator step.
      - name: Committed GraphQL types match the committed schema
        run: npm run check:schema
      - name: Content policy gate refuses what it must
        run: npm run check:content-policy:self-test
      # The generated default origin must name the tier this ref publishes for.
      # Hermetic, like check:schema above: it compares the file to the REF, so it needs
      # neither the operator's tier table nor a sibling checkout. The cross-repo gate that
      # owns the host half runs from preflight-all.sh and therefore not here, which left a
      # window between a promotion merge and the next preflight -- and 15.4.0 was tagged
      # inside it, publishing a prod origin to @dev and @test.
      #
      # On a pull request this judges the BASE, so a dev -> test promotion is checked against
      # test's rule before the merge rather than after. That matters more than it looks: a
      # promotion can rewrite this file with NO conflict, so nothing else announces it.
      - name: Default-origin gate refuses what it must
        run: npm run check:default-origin:self-test
      - name: The default origin names the tier this ref publishes for
        run: npm run check:default-origin
      - name: Build + unit tests + coverage
        run: npm run coverage
      # Runs AFTER the build on purpose. `dist/` is gitignored and is the only
      # thing npm ships, so it is both the highest-value part of the corpus and
      # invisible until something builds it -- which is how a private-repo name
      # reached 69 published versions with nothing objecting.
      - name: No private-repo references in the published artifact
        run: npm run check:content-policy
