# Dependabot: dependency and Actions updates, weekly, grouped. Added 2026-09-08
# with the security-hardening program (see the repo's security.yml). Version
# updates target `dev` (not the GitHub default `prod`). Merge green low-risk
# PRs to `dev`, then promote `dev` → `test` → `prod`. Security-alert PRs still
# open against `prod`; retarget or cherry-pick onto `dev` — do not merge them
# into prod first unless the operator authorizes a hotfix.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # SDK pins are tier-aligned (dev -> X.Y.Z-dev.N, ...) and promoted by hand;
    # a bot bump would cross tiers. Semver-major is a scheduled upgrade, not a
    # weekly bot PR — ungrouped majors eat open-pull-requests-limit.
    ignore:
      - dependency-name: "@crowdedkingdoms/*"
      - dependency-name: "@cks/*"
      # 0.26→0.27 breaks the Monaco worker Test job. Hold until that is fixed;
      # do not take it inside the grouped npm-minor-and-patch PR.
      - dependency-name: "web-tree-sitter"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
