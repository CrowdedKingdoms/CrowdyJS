# Dependabot: dependency and Actions updates, weekly, grouped. Added 2026-09-08
# with the security-hardening program (see the repo's security.yml). PRs land
# against the default branch (prod); rebase or cherry-pick onto dev as usual.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # SDK pins are tier-aligned (dev -> X.Y.Z-dev.N, ...) and promoted by hand;
    # a bot bump would cross tiers. Every other dependency is fair game.
    ignore:
      - dependency-name: "@crowdedkingdoms/*"
      - dependency-name: "@cks/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
