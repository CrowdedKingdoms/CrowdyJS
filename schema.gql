    """Paused session, current epoch, and retry key."""
    input: AgentSessionControlInput!
  ): AgentSession! @requiresPermission(scope: "runtime", permission: "use_studio_agent", scopeArg: "app token scope")
  """
  Immediately make one owner/session run durably CANCELLED, revoke pending capabilities/tools, and abort its local provider stream when present. Requires the app-scoped owner, current epoch, exact run id, and idempotency key; cancellation never silently resumes.
  """
  crowdyStudioAgentCancelRun(
    """Session, current epoch, active run UUID, and retry key."""
    input: CancelAgentRunInput!
  ): AgentRun!
  """
  Permanently close one owner/app session, preempt its active run, revoke leases/approvals/dispatches, detach clients, and start the 30-day agent-data cleanup clock without deleting canonical projects/runtime state. Requires the current epoch and idempotency key.
  """
  crowdyStudioAgentCloseSession(
    """Open session, current epoch, and retry key."""
    input: AgentSessionControlInput!
  ): AgentSession!
  """
  Create a flexible player-model instance in a currently owned grid. The server forces ownerUserId to the caller; this cannot author studio types or app-wide rows.
  """
  playerModelCreateContainer(
    """
    App/grid scope plus optional flexible type key, display name, and JSON object state.
    """
    input: CreatePlayerModelContainerInput!
  ): PlayerModelContainer!
  """
  Delete one caller-owned player-model container and its properties from the specified currently owned grid. Destructive; foreign or absent IDs return NOT_FOUND.
  """
  playerModelDeleteContainer(
    """App/grid scope and player container UUID to delete."""
    input: PlayerModelContainerRefInput!
  ): Boolean!
