  balanceCents: BigInt! @deprecated(reason: "Derived from balanceMicrousd (truncated toward zero). Read balanceMicrousd.")
  """ISO currency code (lowercase)."""
  currency: String!
  """Wallet creation time."""
  createdAt: DateTime!
}

