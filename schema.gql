  """
  provider: String!
  """
  The provider's stable subject id ('sub'). For 'email'/'dev' this is the lowercased email.
  """
  subject: String!
  email: String
  emailVerified: Boolean!
  createdAt: DateTime!
  lastLoginAt: DateTime
}

