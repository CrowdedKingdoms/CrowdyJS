type Subscription {
  """
  Stream complete active gameplay-session count transitions for one app. There is no bootstrap event: query gameModelActivePlayerCount for the current snapshot. The first complete sample is a silent baseline; PARTIAL/UNAVAILABLE samples do not emit or become zero. Delivery uses a Postgres-backed cross-replica best-effort feed with a bounded oldest-drop buffer. Deduplicate by revision; after reconnect or a revision gap, requery gameModelActivePlayerCount. Requires an app-scoped token for this exact app.
  """
  gameModelActivePlayerCountChanged(
    """
    App whose complete count transitions to stream. Must match the app-scoped bearer token.
    """
    appId: BigInt!
  ): GameModelActivePlayerCountChange!
  """
  Push notification whenever a container in the app changes: an invoke mutated it, a direct gameModelSetProperty wrote it, or it was created/deleted. Metadata only (containerId, typeName, changedKeys — no property values); pull the visibility-filtered state with gameModelContainerState on receipt. Post-commit and best-effort (a dropped event costs one missed pull, never correctness) — durable reads remain the source of truth. Optional typeName/sessionId filters narrow delivery. Fans out across all API replicas. Requires a valid token. Replaces interval polling with pull-on-push.
  """
  gameModelContainerChanged(
    """The app (tenant) whose container changes to stream."""
    appId: BigInt!
    """Optional: only changes to containers of this type."""
    typeName: String
    """Optional: only changes scoped to this session."""
    sessionId: String
  ): GmContainerChange!
  """
  Realtime downlink from the game server: spatial notifications and responses, GenericErrorResponse (errors from your sends, correlated by sequenceNumber), and RealtimeConnectionEvent (lifecycle/setup failures). Requires a bearer game token AND an appId-scoped connection — the appId is read from the graphql-transport-ws connection (game tokens are app-agnostic and one UDP socket is shared across apps, so an app-agnostic subscription is rejected with a RealtimeConnectionEvent code APP_ID_REQUIRED, and a missing/invalid token with AUTH_REQUIRED). On subscribe, opens a UDP proxy session if none exists (binds to the least-loaded game server); open/transport failures are delivered as RealtimeConnectionEvent (code UDP_PROXY_CONNECTION_FAILED) and then the stream ends. Only this app’s spatial fan-out is delivered; appId-less control frames always pass. Subscribe before/while sending so async results are not missed. Unsubscribing stops delivery only — it does NOT close the UDP session; call disconnectUdpProxy (or rely on the server inactivity timeout) to release it.
  """
  udpNotifications: UdpNotification
  """
  Replay durable events with seq greater than afterSeq, then tail newly committed facts using database replay plus in-memory wakeups. Requires an app-scoped owner, use_studio_agent, and exact current clientEpoch. Delivery is ordered and at-least-once: deduplicate eventId/seq, fill gaps with crowdyStudioAgentHistory, and acknowledge only contiguous sequences.
  """
  crowdyStudioAgentEvents(
    """Owner/app session UUID to replay and tail."""
    sessionId: String!
    """Exclusive last applied sequence as a non-negative decimal BigInt."""
    afterSeq: BigInt!
    """
    Exact current attached epoch; a newer attach terminates this stream with AGENT_CLIENT_EPOCH_STALE.
    """
    clientEpoch: BigInt!
  ): CrowdyStudioAgentEvent! @requiresPermission(scope: "runtime", permission: "use_studio_agent", scopeArg: "app token scope")
}

"""
All game-server messages delivered over the UDP proxy as GraphQL payloads. Subscribe to udpNotifications before or with sending mutations so responses and GenericErrorResponse (correlate via sequenceNumber) are not missed. NOTE: the ActorUpdateResponse and VoxelUpdateResponse members are LEGACY and never emitted (applied updates arrive as your own *Notification self-echo; failures as GenericErrorResponse) — they remain in the union for backward compatibility and will be removed in a future major version.
"""
union UdpNotification = ActorUpdateResponse | ActorUpdateNotification | VoxelUpdateResponse | VoxelUpdateNotification | ClientAudioNotification | ClientTextNotification | ClientEventNotification | ServerEventNotification | SingleActorMessageNotification | ChannelMessageNotification | GenericErrorResponse | RealtimeConnectionEvent

"""
LEGACY — never emitted. The game server retired the dedicated actor-update response opcode (129); an applied update now arrives as your own ActorUpdateNotification (the sender is included in the chunk fan-out) and failures arrive as GenericErrorResponse. This type remains in the UdpNotification union for backward compatibility only — do not select it in new code; it will be removed in a future major version.
"""
type ActorUpdateResponse {
  """The ID of the app where the actor update was processed."""
  appId: BigInt!
  """The X coordinate of the chunk where the actor is located."""
  chunkX: BigInt!
  """The Y coordinate of the chunk where the actor is located."""
  chunkY: BigInt!
  """The Z coordinate of the chunk where the actor is located."""
  chunkZ: BigInt!
  """Chunk replication distance (0-8) from the original message."""
  distance: Int!
  """Decay algorithm (0-5) from the original message."""
  decayRate: Int!
  """The unique identifier of the actor that was updated."""
  uuid: String!
  """
  The sequenceNumber echoed back from the originating sendActorUpdate request (a uint8, 0-255, wrapping at modulo 256). Use it to correlate this response with that send. Correlation only — not an idempotency key.
  """
  sequenceNumber: Int!
  """Server-generated epoch milliseconds timestamp."""
  epochMillis: BigInt!
}

