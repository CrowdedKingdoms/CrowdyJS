  hasNextPage: Boolean!
  """True if edges exist before `startCursor`."""
  hasPreviousPage: Boolean!
  """Opaque cursor of the first edge in this page."""
  startCursor: String
  """Opaque cursor of the last edge in this page; pass as `after`."""
