  """Unique app-budget id (BigInt as a decimal string)."""
  appBudgetId: BigInt!
  """Organization that owns the app (BigInt as a decimal string)."""
  orgId: BigInt!
  """App this budget applies to (BigInt as a decimal string)."""
  appId: BigInt!
