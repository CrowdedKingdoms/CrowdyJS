fragment GmSessionFields on GmSession {
  sessionId
  appId
  name
  status
  createdByUserId
  currentTurnUserId
  metadataJson
  admission
  maxParticipants
  participantCount
  hostUserId
  hostTerm
  revision
  endedAt
  endReason
  createdAt
  presence
  gridId
  seededContainerCount
}

fragment GmSessionParticipantFields on GmSessionParticipant {
  sessionId
  userId
  role
  state
  incarnation
  actorUuid
  joinedAt
  leftAt
  leftReason
}

fragment GmSessionEventFields on GmSessionEvent {
  appId
  sessionId
  revision
  kind
  payloadJson
  createdAt
}

fragment GmContainerFields on GmContainer {
  containerId
  appId
  sessionId
  typeName
  displayName
  description
  ownerUserId
  metadataJson
}

fragment GmInvokeResultFields on GmInvokeResult {
  eventId
  functionName
  success
  policyBypassed
  returnValueJson
  fault {
    code
    blame
    retryable
  }
  errorMessage
  mutationsApplied {
    containerId
    key
    valueType
    oldValueJson
    newValueJson
  }
}

mutation GameModelCreateSession($input: CreateSessionInput!) {
  gameModelCreateSession(input: $input) {
    ...GmSessionFields
  }
}

mutation GameModelJoinSession($input: JoinSessionInput!) {
  gameModelJoinSession(input: $input) {
    ...GmSessionParticipantFields
  }
}

mutation GameModelLeaveSession($input: LeaveSessionInput!) {
  gameModelLeaveSession(input: $input) {
    ...GmSessionParticipantFields
  }
}

mutation GameModelSetSessionTurn($input: SetSessionTurnInput!) {
  gameModelSetSessionTurn(input: $input) {
    ...GmSessionFields
  }
}

mutation GameModelSetSessionAdmission($input: SetSessionAdmissionInput!) {
  gameModelSetSessionAdmission(input: $input) {
    ...GmSessionFields
  }
}

mutation GameModelTransferSessionHost($input: TransferSessionHostInput!) {
  gameModelTransferSessionHost(input: $input) {
    ...GmSessionFields
  }
}

mutation GameModelEndSession($input: EndSessionInput!) {
  gameModelEndSession(input: $input) {
    ...GmSessionFields
  }
}

mutation GameModelCreateContainer($input: CreateContainerInput!) {
  gameModelCreateContainer(input: $input) {
    ...GmContainerFields
  }
}

mutation GameModelDeleteContainer($appId: BigInt!, $containerId: String!) {
  gameModelDeleteContainer(appId: $appId, containerId: $containerId)
}

mutation GameModelSetProperty($input: SetContainerPropertyInput!) {
  gameModelSetProperty(input: $input) {
    ...GmContainerFields
  }
}

mutation GameModelAddEdge($input: AddEdgeInput!) {
  gameModelAddEdge(input: $input) {
    edgeId
    fromContainerId
    toContainerId
    relationshipType
    weight
  }
}

mutation GameModelDeleteEdge($appId: BigInt!, $edgeId: String!) {
  gameModelDeleteEdge(appId: $appId, edgeId: $edgeId)
}

mutation GameModelInvoke($input: InvokeFunctionInput!) {
  gameModelInvoke(input: $input) {
    ...GmInvokeResultFields
  }
}

query GameModelContainer($appId: BigInt!, $containerId: String!) {
  gameModelContainer(appId: $appId, containerId: $containerId) {
    ...GmContainerFields
  }
}

query GameModelContainers(
  $appId: BigInt!
  $typeName: String
  $sessionId: String
  $bindingKey: String
  $where: [GmPropertyPredicateInput!]
  $limit: Int
  $offset: Int
) {
  gameModelContainers(
    appId: $appId
    typeName: $typeName
    sessionId: $sessionId
    bindingKey: $bindingKey
    where: $where
    limit: $limit
    offset: $offset
  ) {
    ...GmContainerFields
  }
}

subscription GameModelContainerChanged(
  $appId: BigInt!
  $typeName: String
  $sessionId: String
) {
  gameModelContainerChanged(
    appId: $appId
    typeName: $typeName
    sessionId: $sessionId
  ) {
    appId
    containerId
    typeName
    sessionId
    source
    functionName
    changedKeys
    occurredAt
  }
}

query GameModelContainerState($appId: BigInt!, $containerId: String!) {
  gameModelContainerState(appId: $appId, containerId: $containerId) {
    containerId
    appId
    sessionId
    typeName
    displayName
    ownerUserId
    propertiesJson
  }
}

query GameModelContainerStates($appId: BigInt!, $containerIds: [String!]!) {
  gameModelContainerStates(appId: $appId, containerIds: $containerIds) {
    containerId
    appId
    sessionId
    typeName
    displayName
    ownerUserId
    propertiesJson
  }
}

query GameModelTraverse(
  $appId: BigInt!
  $rootId: String!
  $relationshipType: String!
  $depth: Int
) {
  gameModelTraverse(
    appId: $appId
    rootId: $rootId
    relationshipType: $relationshipType
    depth: $depth
  ) {
    rootId
    nodes {
      ...GmContainerFields
    }
    edges {
      edgeId
      fromContainerId
      toContainerId
      relationshipType
      weight
    }
  }
}

query GameModelSession($appId: BigInt!, $sessionId: String!) {
  gameModelSession(appId: $appId, sessionId: $sessionId) {
    ...GmSessionFields
  }
}

query GameModelSessions(
  $appId: BigInt!
  $status: String
  $admission: String
  $hostUserId: BigInt
  $limit: Int
  $gridId: BigInt
) {
  gameModelSessions(
    appId: $appId
    status: $status
    admission: $admission
    hostUserId: $hostUserId
    limit: $limit
    gridId: $gridId
  ) {
    ...GmSessionFields
  }
}

query GameModelSessionSnapshot($appId: BigInt!, $sessionId: String!) {
  gameModelSessionSnapshot(appId: $appId, sessionId: $sessionId) {
    revision
    session {
      ...GmSessionFields
    }
    participants {
      ...GmSessionParticipantFields
    }
  }
}

query GameModelSessionEvents(
  $appId: BigInt!
  $sessionId: String!
  $afterRevision: String!
  $limit: Int
) {
  gameModelSessionEvents(
    appId: $appId
    sessionId: $sessionId
    afterRevision: $afterRevision
    limit: $limit
  ) {
    ...GmSessionEventFields
  }
}

query GameModelSessionInspect($appId: BigInt!, $sessionId: String!) {
  gameModelSessionInspect(appId: $appId, sessionId: $sessionId) {
    session {
      ...GmSessionFields
    }
    participants {
      presence
      presenceFrom
      participant {
        ...GmSessionParticipantFields
      }
    }
    recentEvents {
      ...GmSessionEventFields
    }
  }
}

subscription GameModelSessionChanged(
  $appId: BigInt!
  $sessionId: String!
  $afterRevision: String
) {
  gameModelSessionChanged(
    appId: $appId
    sessionId: $sessionId
    afterRevision: $afterRevision
  ) {
    ...GmSessionEventFields
  }
}

query GameModelEvents(
  $appId: BigInt!
  $sessionId: String
  $selfContainerId: String
  $functionName: String
  $success: Boolean
  $limit: Int
  $offset: Int
) {
  gameModelEvents(
    appId: $appId
    sessionId: $sessionId
    selfContainerId: $selfContainerId
    functionName: $functionName
    success: $success
    limit: $limit
    offset: $offset
  ) {
    eventId
    flowId
    sessionId
    functionName
    selfContainerId
    callerUserId
    callerKind
    automationId
    paramsJson
    mutationsAppliedJson
    permissionEffectsAppliedJson
    returnValueJson
    success
    errorMessage
    executedAt
  }
}

query GameModelEventsConnection(
  $appId: BigInt!
  $first: Int
  $after: String
  $sessionId: String
  $selfContainerId: String
  $functionName: String
  $success: Boolean
) {
  gameModelEventsConnection(
    appId: $appId
    first: $first
    after: $after
    sessionId: $sessionId
    selfContainerId: $selfContainerId
    functionName: $functionName
    success: $success
  ) {
    edges {
      cursor
      node {
        eventId
        flowId
        sessionId
        functionName
        selfContainerId
        callerUserId
        callerKind
        automationId
        paramsJson
        mutationsAppliedJson
        permissionEffectsAppliedJson
        returnValueJson
        success
        errorMessage
        executedAt
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

# Cross-engine flow timeline: reuses GmAutomationRunFields
# (GameModelAutomations.graphql) and ComputeRunFields (ComputeModules.graphql).
query GameModelFlow($appId: BigInt!, $flowId: String!) {
  gameModelFlow(appId: $appId, flowId: $flowId) {
    flowId
    events {
      eventId
      flowId
      sessionId
      functionName
      selfContainerId
      callerUserId
      callerKind
      automationId
      paramsJson
      mutationsAppliedJson
      permissionEffectsAppliedJson
      returnValueJson
      success
      errorMessage
      executedAt
    }
    automationRuns {
      ...GmAutomationRunFields
    }
    moduleRuns {
      ...ComputeRunFields
    }
  }
}
