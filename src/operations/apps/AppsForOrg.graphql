query AppsForOrg($orgSlug: String!) {
  appsForOrg(orgSlug: $orgSlug) {
    appId
    orgId
    name
    slug
    description
    visibility
    status
    metadata
    wildernessWritesOpen
    replayLoggingEnabled
    splitMode
    applicationApiUrl
    gameApiUrl: applicationApiUrl
    createdAt
    updatedAt
  }
}
