query MyApps {
  myApps {
    appId
    orgId
    name
    slug
    description
    visibility
    status
    metadata
    wildernessWritesOpen
    replayLoggingEnabled
    splitMode
    applicationApiUrl
    gameApiUrl: applicationApiUrl
    createdAt
    updatedAt
    org {
      orgId
      slug
      name
    }
  }
}
