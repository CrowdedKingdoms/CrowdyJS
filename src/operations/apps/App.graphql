query App($appId: BigInt!) {
  app(appId: $appId) {
    appId
    orgId
    name
    slug
    description
    visibility
    status
    metadata
    wildernessWritesOpen
    replayLoggingEnabled
    claimOwnerKeys
    splitMode
    deploymentTarget
    reservedUdpBytesPerSec
    reservedGraphqlOpsPerSec
    runtimeStatus
    runtimeDenialReason
    gameApiUrl
    launchUrl
    redirectUris
    isTrusted
    clientType
    createdAt
    updatedAt
    org {
      orgId
      slug
      name
    }
  }
}
