mutation UpdateApp($appId: BigInt!, $input: UpdateAppInput!) {
  updateApp(appId: $appId, input: $input) {
    appId
    orgId
    name
    slug
    description
    visibility
    status
    metadata
    wildernessWritesOpen
    replayLoggingEnabled
    replayLoggingRecordsVoice
    replayLoggingRecordsVideo
    recording {
      enabled
      voice
      video
    }
    minPlayerAge
    effectiveMinPlayerAge
    claimOwnerKeys
    updatedAt
  }
}
