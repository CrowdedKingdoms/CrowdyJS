fragment PlayerWasmModuleFields on PlayerWasmModule {
  moduleId
  appId
  gridId
  name
  description
  authorUserId
  authorOrgId
  enabled
  draft
  currentVersionId
  currentTarget
  circuitState
  lastError
  createdAt
  updatedAt
}

fragment PlayerWasmModuleVersionFields on PlayerWasmModuleVersion {
  versionId
  moduleId
  versionNo
  target
  sourceFilesJson
  openSource
  compileStatus
  compileLog
  compiledSizeBytes
  projectId
  sourceRevision
  githubCommitSha
  createdAt
}

mutation PlayerComputeDeploy($input: DeployPlayerComputeInput!) {
  playerComputeDeploy(input: $input) {
    ...PlayerWasmModuleVersionFields
  }
}

query PlayerComputeMyModules($appId: BigInt!) {
  playerComputeMyModules(appId: $appId) {
    ...PlayerWasmModuleFields
  }
}

query PlayerComputeVersions(
  $appId: BigInt!
  $gridId: BigInt!
  $name: String!
) {
  playerComputeVersions(appId: $appId, gridId: $gridId, name: $name) {
    ...PlayerWasmModuleVersionFields
  }
}

mutation PlayerComputeDelete(
  $appId: BigInt!
  $gridId: BigInt!
  $name: String!
) {
  playerComputeDelete(appId: $appId, gridId: $gridId, name: $name)
}

query PlayerComputeUsage($appId: BigInt!) {
  playerComputeUsage(appId: $appId) {
    appId
    hourUnitsUsed
    dayUnitsUsed
    unitsPerHour
    unitsPerDay
    compilesThisHour
    maxCompilesPerHour
    gateStatus
    gateReason
  }
}

mutation PlayerComputeSetSwitch(
  $appId: BigInt!
  $scope: String!
  $disabled: Boolean!
  $scopeRef: BigInt
  $reason: String
  $listingRef: String
) {
  playerComputeSetSwitch(
    appId: $appId
    scope: $scope
    disabled: $disabled
    scopeRef: $scopeRef
    reason: $reason
    listingRef: $listingRef
  )
}

query PlayerComputeSwitches($appId: BigInt!) {
  playerComputeSwitches(appId: $appId) {
    switchId
    appId
    scope
    scopeRef
    listingRef
    reason
    disabledAt
  }
}

query PlayerComputeArtifact(
  $appId: BigInt!
  $gridId: BigInt!
  $name: String!
  $versionId: String
) {
  playerComputeArtifact(
    appId: $appId
    gridId: $gridId
    name: $name
    versionId: $versionId
  ) {
    versionId
    artifactHash
    artifactBase64
    sizeBytes
    abiVersion
    contractJson
    clientFuelPerDispatch
  }
}
